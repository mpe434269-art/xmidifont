name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descomprimir proyecto
        run: unzip -q XMidi_src.zip -d work

      - name: Agregar libc++_shared.so desde el NDK del runner
        run: |
          SRC=work/xmidi_src
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk}}"
          ARM=$(find "$NDK" -path "*sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" | head -1)
          X86=$(find "$NDK" -path "*sysroot/usr/lib/i686-linux-android/libc++_shared.so" | head -1)
          echo "arm: $ARM"; echo "x86: $X86"
          test -n "$ARM" && test -n "$X86"
          cp "$ARM" "$SRC/lib/armeabi-v7a/libc++_shared.so"
          cp "$X86" "$SRC/lib/x86/libc++_shared.so"

      - name: Descargar apktool (ultima version)
        run: |
          URL=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep browser_download_url | grep '\.jar"' | head -1 | cut -d'"' -f4)
          echo "$URL"
          curl -sL -o apktool.jar "$URL"

      - name: Compilar con apktool
        run: java -jar apktool.jar b work/xmidi_src -o unsigned.apk

      - name: Alinear y firmar
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore ks.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=XMidi"
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:android --key-pass pass:android \
            --out XMidi-fluid2.apk aligned.apk
          "$BT/apksigner" verify XMidi-fluid2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XMidi-apk
          path: XMidi-fluid2.apk
          
