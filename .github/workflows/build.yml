name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Descomprimir proyecto
        run: unzip -q StyleGrooveMidis-proyecto.zip -d work

      - name: Buscar proyecto
        run: |
          F=$(find work -name settings.gradle | head -1)
          if [ -z "$F" ]; then
            echo "No hay settings.gradle dentro del zip."
            ls -R work | head -50
            exit 1
          fi
          echo "PROJ=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $(dirname "$F")"

      - name: Compilar APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" StyleGrooveMidis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StyleGrooveMidis-apk
          path: StyleGrooveMidis.apk
