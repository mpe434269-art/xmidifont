name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descomprimir proyecto
        run: unzip -q XMidi_src.zip -d work

      - name: Compilar libxsynth (puente nuevo) y agregar libc++_shared
        run: |
          set -e
          SRC=work/xmidi_src
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk}}"
          TCROOT=$(ls -d "$NDK"/toolchains/llvm/prebuilt/* | head -1)
          TC="$TCROOT/bin"
          echo "NDK: $NDK"
          for entry in "arm64-v8a:aarch64-linux-android:aarch64-linux-android" \
                       "armeabi-v7a:armv7a-linux-androideabi:arm-linux-androideabi"; do
            ABI=${entry%%:*}; REST=${entry#*:}; CCP=${REST%%:*}; SYS=${REST#*:}
            echo "=== $ABI ==="
            "$TC/${CCP}24-clang" -shared -fPIC -O2 -Wall -Wno-deprecated-declarations \
              -I "$SRC/native/include" -o "$SRC/lib/$ABI/libxsynth.so" "$SRC/native/xsynth.c" \
              -L "$SRC/lib/$ABI" -lfluidsynth -lOpenSLES -llog -lm \
              -Wl,--allow-shlib-undefined -Wl,-z,max-page-size=16384
            echo "funciones XSynth exportadas: $("$TC/llvm-nm" -D --defined-only "$SRC/lib/$ABI/libxsynth.so" | grep -c XSynth_)"
            CPP=$(find "$TCROOT/sysroot/usr/lib/$SYS" -maxdepth 1 -name libc++_shared.so | head -1)
            echo "libc++: $CPP"
            test -n "$CPP"
            cp "$CPP" "$SRC/lib/$ABI/libc++_shared.so"
          done

      - name: Preparar variantes A y B (para comparar el sonido)
        run: |
          set -e
          SRC=work/xmidi_src
          # B = motor FluidSynth 2.6 + puente ORIGINAL (solo 32 bits)
          cp -r $SRC work/var_B
          rm -rf work/var_B/lib work/var_B/native work/var_B/variants
          mkdir -p work/var_B/lib/armeabi-v7a
          cp $SRC/lib/armeabi-v7a/* work/var_B/lib/armeabi-v7a/
          cp $SRC/variants/B_xsynth_armeabi-v7a.so work/var_B/lib/armeabi-v7a/libxsynth.so
          # A = app como estaba antes de cambiar el motor (FluidSynth 1.0.9 + puente original)
          cp -r $SRC work/var_A
          rm -rf work/var_A/lib work/var_A/native work/var_A/variants
          cp -r $SRC/variants/A_lib work/var_A/lib
          # C (principal) sin carpetas auxiliares
          rm -rf $SRC/native $SRC/variants

      - name: Descargar apktool (ultima version)
        run: |
          URL=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep browser_download_url | grep '\.jar"' | head -1 | cut -d'"' -f4)
          echo "$URL"
          curl -sL -o apktool.jar "$URL"

      - name: Compilar y firmar las tres variantes
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore ks.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=XMidi"
          mkdir -p out
          build() { # nombre carpeta archivo-final
            java -jar apktool.jar b "$2" -o "unsigned_$1.apk"
            "$BT/zipalign" -p -f 4 "unsigned_$1.apk" "aligned_$1.apk"
            "$BT/apksigner" sign --ks ks.jks --ks-pass pass:android --key-pass pass:android \
              --out "out/$3" "aligned_$1.apk"
            "$BT/apksigner" verify "out/$3"
          }
          build C work/xmidi_src XMidi-C-puente-nuevo.apk
          build B work/var_B XMidi-B-motor2-puente-original.apk
          build A work/var_A XMidi-A-original-como-antes.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: XMidi-apk
          path: out/*.apk
